{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Avera{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/background.css' %}">

    <style>
        body {
    color: #333;
    background-color: #c2d1e5;
    position: relative;
}

body::before,
body::after {
    content: "";
    position: fixed;
    width: 450px;
    height: 450px;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.5;
    z-index: -1;
    animation: floatBlob 18s ease-in-out infinite alternate;
}

body::before {
    background: #10b981;
    top: -100px;
    left: -100px;
}

body::after {
    background: #3b82f6;
    bottom: -100px;
    right: -100px;
    animation-delay: -9s;
}

@keyframes floatBlob {
    0%   { transform: translate(0, 0) scale(1); }
    50%  { transform: translate(150px, 100px) scale(1.2); }
    100% { transform: translate(-50px, 200px) scale(0.9); }
}
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

    body {
    background-color: #c2d1e5 !important;
    color: #333;
}
    .navbar { background: #2c3e50; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
    .logo { color: #fff; font-size: 24px; font-weight: bold; text-decoration: none; }
    nav { display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }
    nav a { color: #ecf0f1; text-decoration: none; font-size: 15px; transition: 0.3s; padding: 4px 8px; border-radius: 4px; }
    nav a:hover { color: #1abc9c; background: rgba(255,255,255,0.05); }

    .container {
    max-width: 1100px;
    margin: 40px auto;
    padding: 20px;
    background: rgba(255, 255, 255, 0.35);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.5);
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(31, 60, 100, 0.12);
}

    footer { text-align: center; padding: 20px; background: #2c3e50; color: white; margin-top: 50px; }
</style>
</head>
<body>
    <div class="navbar">
        <a href="{% url 'home' %}" class="logo">Avera</a>
        <nav>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'adoption_hub' %}">Adoption</a>
            <a href="{% url 'children_list' %}">Children Info</a>
            <a href="{% url 'organizations_list' %}">Organizations</a>
            <a href="{% url 'stories_list' %}">Stories</a>
            <a href="{% url 'notifications_list' %}">Notifications</a>
            <a href="{% url 'support_page' %}">Support</a>
            <a href="/faq/">FAQ</a>
            <a href="{% url 'feedback_list' %}">Feedback</a>
            <a href="{% url 'login' %}">Login</a>
            <a href="{% url 'register' %}">Register</a>
        </nav>
    </div>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <footer>
        <p>&copy; 2026 Avera Project. All Rights Reserved.</p>
    </footer>
</body>
</html>
